<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>软件更新</title>
<link rel="stylesheet" href="/static/style.css?v=20261118b">
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-icon" src="/static/icon.png" alt="">软件更新</div>
  <div class="topbar-right">
    <a href="/" class="btn ghost">← 返回主页</a>
    <button id="btn-menu" class="btn ghost">⋮</button>
  </div>
</header>

<main class="page-wrap">
  <section class="panel hidden" id="auth-notice">
    <h2>需要授权</h2>
    <p class="hint">软件更新只能在<b>本机</b>操作，或在本机创建密码并<b>激活</b>后使用。</p>
    <p class="hint">请在本机打开本页面，或前往 <a href="/password">密码管理</a> 页面激活。</p>
  </section>

  <section class="panel">
    <div class="update-head">
      <div>
        <h2>当前版本</h2>
        <p class="hint"><b id="cur-version">…</b> · 通道：<span id="cur-channel">…</span></p>
      </div>
      <div>
        <button id="btn-check" class="btn primary">🔍 检查更新</button>
        <button id="btn-update" class="btn primary hidden">⬇ 下载更新</button>
        <button id="btn-install" class="btn primary hidden">✅ 安装并重启</button>
      </div>
    </div>
    <p class="hint" id="latest-info">尚未检查更新。</p>
  </section>

  <section class="panel" id="progress-panel" style="display:none">
    <h2 style="margin-bottom:10px">更新进度</h2>
    <div class="update-progress-bar"><div id="progress-fill"></div></div>
    <p class="hint" style="margin-top:8px"><span id="progress-stage">准备中</span> · <span id="progress-pct">0%</span></p>
    <p class="hint" id="progress-detail"></p>
  </section>

  <section class="panel">
    <h2 style="margin-bottom:10px">更新日志</h2>
    <div id="update-notes" class="update-notes">—</div>
  </section>

  <section class="panel">
    <h2 style="margin-bottom:10px">手动上传更新包</h2>
    <div class="fs-toolbar">
      <input id="zip-file" type="file" accept=".zip" />
      <button id="btn-upload" class="btn primary">上传并安装 zip</button>
    </div>
    <p class="hint">zip 第一层目录需为新版本号目录（内含 app.py）；如需同时更新运行环境，可在压缩包里附带 <b>python/</b> 目录，安装时会增量覆盖。</p>
  </section>
</main>

<!-- 设置菜单弹层 -->
<div id="menu-pop" class="menu-pop hidden">
  <div class="menu-pop-box">
    <label>更新通道
      <select id="set-channel">
        <option value="stable">稳定（只收正式版）</option>
        <option value="beta">内测（收正式版 + 内测版）</option>
        <option value="dev">开发（收全部：正式 + 内测 + 开发）</option>
      </select>
    </label>
    <label>更新策略
      <select id="set-policy">
        <option value="none">不检查更新</option>
        <option value="check">启动时检查更新</option>
        <option value="download">自动静默下载但不安装</option>
        <option value="install">自动解压安装</option>
      </select>
    </label>
    <button id="btn-save-policy" class="btn primary">保存</button>
  </div>
</div>

<!-- 更新进行中的整页锁定层：只显示进度，其他按钮点不到 -->
<div id="busy-mask" class="hidden">
  <div class="busy-card">
    <div class="busy-spin"></div>
    <h3 id="busy-title">正在下载更新</h3>
    <div class="busy-pct" id="busy-pct">0%</div>
    <div class="busy-bar"><div id="busy-fill"></div></div>
    <div class="busy-detail" id="busy-detail">正在准备…</div>
    <div class="busy-tip">更新进行中，页面已锁定（避免重复下载）。<br>可以关闭本页，软件会在后台继续下载。</div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/auth.js?v=20261118b"></script>
<script src="/static/update.js?v=20261118b"></script>
</body>
</html>
