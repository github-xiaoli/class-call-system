<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>运行日志 - 班级叫号器</title>
<link rel="icon" href="/static/favicon.ico" />
<style>
  :root { --bg:#0f172a; --panel:#111c33; --line:#1e2d4d; --fg:#e2e8f0; --muted:#93a4c0;
          --ok:#34d399; --warn:#fbbf24; --err:#f87171; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg);
         font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
         display: flex; flex-direction: column; }
  header { padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
           display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 700; }
  .tag { font-size: 12px; color: var(--muted); }
  .grow { flex: 1; }
  button, select, input { font-family: inherit; font-size: 13px; }
  button { background: #1c2b49; color: var(--fg); border: 1px solid var(--line);
           border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover { background: #24385f; }
  button.primary { background: #1d4ed8; border-color: #2563eb; }
  button.primary:hover { background: #2563eb; }
  input, select { background: #0b1526; color: var(--fg); border: 1px solid var(--line);
                  border-radius: 8px; padding: 7px 10px; }
  #search { width: 180px; }
  #toolbar { padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
             background: #0d1728; border-bottom: 1px solid var(--line); font-size: 13px; }
  #status { color: var(--muted); font-size: 12.5px; }
  #status b { color: var(--ok); font-weight: 600; }
  #view { flex: 1; overflow: auto; padding: 10px 14px 40px; font-size: 13px;
          font-family: "Cascadia Mono", Consolas, "Microsoft YaHei", monospace; line-height: 1.55; }
  .ln { display: flex; gap: 10px; padding: 1px 0; border-bottom: 1px solid rgba(30,45,77,.45);
        white-space: pre-wrap; word-break: break-word; }
  .ln .t { color: #64748b; flex: 0 0 auto; }
  .ln .x { flex: 1; }
  .ln.warn .x { color: var(--warn); }
  .ln.error .x { color: var(--err); }
  .ln mark { background: #fde68a; color: #111; border-radius: 3px; }
  #empty { color: var(--muted); padding: 18px 0; }
  #hint { padding: 6px 14px; background: #14233c; color: var(--muted); font-size: 12.5px;
          border-bottom: 1px solid var(--line); }
  #hint code { background: #0b1526; padding: 1px 5px; border-radius: 4px; color: #cbd5e1; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
         margin-right: 5px; vertical-align: middle; }
  .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.dead { background: var(--err); }
</style>
</head>
<body>
{% include "_shell.html" %}
{% include "_icons.html" %}
<header>
  <h1><svg class="ic-inline"><use href="#ic-roster"/></svg> 运行日志</h1>
  <span class="tag">v{{ version }}{% if edition != 'stable' %} · {{ edition }}{% endif %}</span>
  <span class="grow"></span>
  <button id="btn-pause">⏸ 暂停</button>
  <button id="btn-clear"><svg class="ic-inline"><use href="#ic-trash"/></svg> 清空显示</button>
  <button id="btn-export" class="primary"><svg class="ic-inline"><use href="#ic-download"/></svg> 导出日志</button>
  <button id="btn-home"><svg class="ic-inline"><use href="#ic-home"/></svg> 返回主页</button>
</header>

<div id="toolbar">
  <span id="status"><span class="dot" id="dot"></span>正在连接…</span>
  <input id="search" placeholder="过滤关键字（如 mDNS）" />
  <select id="level">
    <option value="all">全部级别</option>
    <option value="info">只看普通</option>
    <option value="warn">只看警告</option>
    <option value="error">只看错误</option>
  </select>
  <label class="tag"><input type="checkbox" id="follow" checked /> 自动滚到底部</label>
  <span class="grow"></span>
  <span class="tag" id="file"></span>
</div>

<div id="hint">
  日志同时写入 <code>data/logs/app-日期.log</code>（保留 7 天）。遇到问题把「导出日志」得到
  的 txt 发过来即可，不用再截图黑窗口。手机上也能看：<code>http://主机名.local:端口/logs</code>
</div>

<div id="view"><div id="empty">等待日志…</div></div>

<script src="/static/auth.js"></script>
<script src="/static/logs.js"></script>
</body>
</html>
