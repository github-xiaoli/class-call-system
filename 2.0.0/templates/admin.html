<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理员后台 · 班级叫号器</title>
<link rel="stylesheet" href="/static/style.css?v=20261127a">
</head>
<body>
{% include "_shell.html" %}
{% include "_icons.html" %}
<header class="topbar">
  <div class="brand"><img class="brand-icon" src="/static/icon.png" alt="">管理员后台</div>
  <div class="topbar-right">
    <a href="/" class="btn ghost">← 返回主页</a>
  </div>
</header>

<main class="page-wrap">
  <!-- 账号管理 -->
  <section class="panel">
    <div class="panel-head">
      <h2>账号管理 <span class="badge" id="user-count">0</span></h2>
      <button id="btn-new-user" class="btn primary small">＋ 新建账号</button>
    </div>
    <div id="new-user-form" class="admin-form hidden">
      <div class="form-grid">
        <label>用户名 <input id="nu-name" maxlength="20" placeholder="2–20 位" /></label>
        <label>显示名 <input id="nu-display" maxlength="20" placeholder="如：张老师" /></label>
        <label>角色
          <select id="nu-role">
            <option value="teacher">老师</option>
            <option value="admin">管理员</option>
          </select>
        </label>
        <label>初始密码 <input id="nu-pwd" type="text" maxlength="64" placeholder="至少 4 位" /></label>
      </div>
      <p class="hint">账号首次登录后会被要求立即修改密码。</p>
      <div class="admin-actions">
        <button id="btn-create-user" class="btn primary">创建</button>
        <button id="btn-cancel-user" class="btn ghost">取消</button>
      </div>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>用户名</th><th>显示名</th><th>角色</th><th>状态</th><th>在线</th><th>操作</th>
        </tr></thead>
        <tbody id="user-tbody"></tbody>
      </table>
      <div id="user-empty" class="empty">加载中…</div>
    </div>
  </section>

  <!-- 在线会话 -->
  <section class="panel">
    <div class="panel-head">
      <h2>在线设备 <span class="badge" id="sess-count">0</span></h2>
      <button id="btn-refresh-sess" class="btn ghost small"><svg class="ic-inline"><use href="#ic-refresh"/></svg> 刷新</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>用户</th><th>IP</th><th>浏览器</th><th>最后活跃</th><th>操作</th></tr></thead>
        <tbody id="sess-tbody"></tbody>
      </table>
      <div id="sess-empty" class="empty">暂无在线会话</div>
    </div>
  </section>

  <!-- 审计日志 -->
  <section class="panel">
    <div class="panel-head">
      <h2>审计日志 <span class="badge" id="audit-total">0</span></h2>
      <button id="btn-refresh-audit" class="btn ghost small"><svg class="ic-inline"><use href="#ic-refresh"/></svg> 刷新</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>时间</th><th>用户</th><th>动作</th><th>对象</th><th>IP</th><th>说明</th></tr></thead>
        <tbody id="audit-tbody"></tbody>
      </table>
      <div id="audit-empty" class="empty">暂无日志</div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script nonce="{{ csp_nonce }}">
(function () {

  /* 出错时给出可见提示（避免"页面能开但点了没反应"无从排查） */
  function cqtShowFail(msg) {
    let bar = document.getElementById("cqt-fail-bar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "cqt-fail-bar";
      bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#fdecec;"
        + "color:#a4262c;border-bottom:1px solid #f3b7b7;padding:10px 14px;font-size:13px;"
        + "font-family:inherit;line-height:1.5";
      document.body.appendChild(bar);
    }
    bar.textContent = "页面出错：" + msg + "  —— 请先按 Ctrl + F5 强制刷新；若仍不行，"
      + "请确认已用管理员账号登录，并把这句话截图反馈。";
  }
  window.addEventListener("error", (e) => cqtShowFail(e.message || "脚本错误"));
  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason || {};
    cqtShowFail((r && (r.message || r.code)) ? String(r.message || r.code) : String(r));
  });
  const $ = (id) => document.getElementById(id);
  let toastTimer = null;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add("hidden"), 2600);
  }

  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  async function api(url, opts) {
    const res = await fetch(url, Object.assign({
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
    }, opts || {}));
    if (res.status === 401) { location.href = "/login"; throw new Error("未登录"); }
    const data = await res.json().catch(() => ({ ok: false, error: "响应解析失败" }));
    if (!res.ok || data.ok === false) {
      throw new Error(data.error || ("请求失败 " + res.status));
    }
    return data;
  }

  function postJSON(url, body) {
    return api(url, { method: "POST", body: JSON.stringify(body || {}) });
  }

  function fmtTime(ts) {
    if (!ts) return "—";
    const d = new Date(ts * 1000);
    const p = (n) => String(n).padStart(2, "0");
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " "
      + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  const AUTH_LABEL = {
    login_ok: "登录成功", login_fail: "登录失败", logout: "退出登录",
    change_pwd: "修改密码", change_pwd_fail: "改密失败",
    reset_ok: "重置密码", reset_fail: "重置失败",
    user_create: "创建账号", user_ban: "封禁账号", user_unban: "解封账号",
    user_kick: "踢下线", user_reset: "重置密码", user_delete: "删除账号",
    session_revoke: "撤销会话", device_revoke: "解绑设备",
    admin_seed: "初始化管理员",
  };

  /* ---------- 账号 ---------- */
  async function loadUsers() {
    const tb = $("user-tbody");
    tb.innerHTML = "";
    try {
      const d = await api("/api/admin/users");
      const users = d.users || [];
      $("user-count").textContent = users.length;
      $("user-empty").classList.toggle("hidden", users.length > 0);
      for (const u of users) {
        const tr = document.createElement("tr");
        const banned = u.status === "banned";
        tr.innerHTML =
          '<td class="admin-mono">' + esc(u.username) + "</td>" +
          "<td>" + esc(u.display_name) + "</td>" +
          '<td><span class="badge ' + (u.is_admin ? "" : "gray") + '">'
            + (u.is_admin ? "管理员" : "老师") + "</span></td>" +
          '<td><span class="badge ' + (banned ? "warn" : "ok") + '">'
            + (banned ? "已封禁" : "正常") + "</span></td>" +
          "<td>" + (u.online ? "<svg class="ic-inline"><use href="#ic-check"/></svg>" : "—") + "</td>" +
          '<td class="admin-ops"></td>';
        const ops = tr.querySelector(".admin-ops");
        const mk = (label, cls, fn) => {
          const b = document.createElement("button");
          b.className = "mini " + (cls || "");
          b.textContent = label;
          b.addEventListener("click", fn);
          ops.appendChild(b);
        };
        if (banned) {
          mk("解封", "", () => act(u.username, "unban"));
        } else {
          mk("封禁", "danger", () => act(u.username, "ban"));
        }
        mk("重置密码", "", () => {
          const pwd = prompt("为「" + u.username + "」设置新密码（至少 4 位）：", "");
          if (pwd === null) return;
          if (pwd.length < 4) { toast("密码至少 4 位"); return; }
          act(u.username, "reset", pwd);
        });
        mk("踢下线", "", () => act(u.username, "kick"));
        if (!u.is_admin) mk("删除", "danger", () => act(u.username, "delete"));
        tb.appendChild(tr);
      }
    } catch (e) {
      $("user-empty").textContent = "加载失败：" + e.message;
      $("user-empty").classList.remove("hidden");
    }
  }

  async function act(username, action, password) {
    const names = { ban: "封禁", unban: "解封", kick: "踢下线", reset: "重置密码", delete: "删除" };
    if (["ban", "delete"].includes(action)
        && !confirm("确定要" + names[action] + "「" + username + "」吗？")) return;
    try {
      const d = await postJSON("/api/admin/users/action",
        { username: username, action: action, password: password || "" });
      toast(d.message || "操作成功");
      await loadUsers();
      await loadSessions();
    } catch (e) {
      toast(e.message);
    }
  }

  $("btn-new-user").addEventListener("click", () => {
    $("new-user-form").classList.toggle("hidden");
    $("nu-name").focus();
  });
  $("btn-cancel-user").addEventListener("click", () => {
    $("new-user-form").classList.add("hidden");
  });
  $("btn-create-user").addEventListener("click", async () => {
    const name = $("nu-name").value.trim();
    const pwd = $("nu-pwd").value;
    if (!name) { toast("请输入用户名"); return; }
    if (pwd.length < 4) { toast("初始密码至少 4 位"); return; }
    try {
      await postJSON("/api/admin/users", {
        username: name, password: pwd,
        role: $("nu-role").value, display_name: $("nu-display").value.trim(),
      });
      toast("账号已创建");
      $("nu-name").value = ""; $("nu-display").value = ""; $("nu-pwd").value = "";
      $("new-user-form").classList.add("hidden");
      await loadUsers();
    } catch (e) {
      toast(e.message);
    }
  });

  /* ---------- 会话 ---------- */
  async function loadSessions() {
    const tb = $("sess-tbody");
    tb.innerHTML = "";
    try {
      const d = await api("/api/admin/sessions");
      const list = d.sessions || [];
      $("sess-count").textContent = list.length;
      $("sess-empty").classList.toggle("hidden", list.length > 0);
      for (const s of list) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td><b>" + esc(s.username) + "</b></td>" +
          '<td class="admin-mono">' + esc(s.ip || "—") + "</td>" +
          '<td class="admin-ua">' + esc((s.ua || "").slice(0, 42)) + "</td>" +
          "<td>" + fmtTime(s.last_seen) + "</td>" +
          '<td><button class="mini danger">失效</button></td>';
        tr.querySelector("button").addEventListener("click", async () => {
          if (!confirm("让该会话立即失效？")) return;
          try {
            await postJSON("/api/admin/sessions/revoke", { sid: s.sid });
            toast("会话已失效");
            await loadSessions();
          } catch (e) { toast(e.message); }
        });
        tb.appendChild(tr);
      }
    } catch (e) {
      toast(e.message);
    }
  }
  $("btn-refresh-sess").addEventListener("click", loadSessions);

  /* ---------- 审计 ---------- */
  async function loadAudit() {
    const tb = $("audit-tbody");
    tb.innerHTML = "";
    try {
      const d = await api("/api/admin/audit?limit=100");
      const logs = d.logs || [];
      $("audit-total").textContent = d.total || 0;
      $("audit-empty").classList.toggle("hidden", logs.length > 0);
      for (const l of logs) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + fmtTime(l.ts) + "</td>" +
          '<td class="admin-mono">' + esc(l.username || "—") + "</td>" +
          "<td>" + esc(AUTH_LABEL[l.action] || l.action) + "</td>" +
          '<td class="admin-mono">' + esc(l.target || "—") + "</td>" +
          '<td class="admin-mono">' + esc(l.ip || "—") + "</td>" +
          '<td class="admin-ua">' + esc(l.detail || "") + "</td>";
        tb.appendChild(tr);
      }
    } catch (e) {
      toast(e.message);
    }
  }
  $("btn-refresh-audit").addEventListener("click", loadAudit);

  loadUsers();
  loadSessions();
  loadAudit();
})();
</script>
</body>
</html>
