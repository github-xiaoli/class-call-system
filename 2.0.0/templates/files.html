<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件传输</title>
<link rel="stylesheet" href="/static/style.css?v=20261118a">
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-icon" src="/static/icon.png" alt="">文件传输</div>
  <div class="topbar-right">
    <a href="/" class="btn ghost">← 返回主页</a>
  </div>
</header>

<main class="page-wrap">
  <section class="panel">
    <div class="fs-toolbar">
      <select id="drive-select"></select>
      <button id="btn-up" class="btn ghost">⬆ 上级</button>
      <button id="btn-refresh" class="btn ghost">🔄 刷新</button>
      <button id="btn-mkdir" class="btn ghost">📂 新建文件夹</button>
      <label class="btn ghost">⬆ 上传文件
        <input id="file-upload" type="file" multiple class="hidden-input" />
      </label>
      <button id="btn-paste" class="btn primary hidden">📋 粘贴到这里</button>
      <button id="btn-cancel-op" class="btn danger hidden">取消</button>
    </div>
    <p class="hint">当前路径：<span id="cur-path"></span>
      <span id="pending-hint" class="hint"></span></p>
    <div id="upload-progress" class="upload-progress hidden">
      <div class="up-row"><span id="up-name">准备上传…</span><span id="up-pct">0%</span></div>
      <div class="up-bar"><div id="up-fill"></div></div>
    </div>
    <p class="hint">可直接拖拽文件/文件夹到下方列表区域上传到当前目录。</p>
  </section>

  <section class="panel">
    <div id="drop-zone" class="fs-list-wrap">
      <table class="fs-table">
        <thead><tr><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead>
        <tbody id="fs-tbody"></tbody>
      </table>
      <div id="fs-empty" class="empty">加载中…</div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/static/auth.js?v=20261118a"></script>
<script src="/static/files.js?v=20261118a"></script>
</body>
</html>
