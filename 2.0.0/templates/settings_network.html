<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>内网服务 · 班级叫号器</title>
<style nonce="{{ csp_nonce }}">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f5fb;color:#1d2437;
    font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  .sub-top{display:flex;align-items:center;gap:12px;background:#2a5bd7;color:#fff;
    padding:10px 16px;position:sticky;top:0;z-index:30}
  .sub-back{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:0;
    color:#fff;border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
  .sub-back:hover{background:rgba(255,255,255,.26)}
  .sub-back svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .sub-title{font-weight:600}
  .wrap{max-width:880px;margin:18px auto 60px;padding:0 16px}
  .card{background:#fff;border:1px solid #e3e8f2;border-radius:14px;padding:18px 20px;
    box-shadow:0 1px 2px rgba(20,40,90,.05)}
  .set-group{margin:22px 0 10px;font-size:13px;font-weight:700;color:#2a5bd7;
    display:flex;align-items:center;gap:8px}
  .set-group:first-child{margin-top:4px}
  .set-group::after{content:"";flex:1;height:1px;background:#e6ebf5}
  .form-row{margin-bottom:14px}
  .form-row>label{display:block;font-size:13px;color:#4a5673;margin-bottom:5px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:12px}
  .form-grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#4a5673}
  input[type=text],input[type=password],input[type=number],select,textarea{
    font:inherit;padding:8px 10px;border:1px solid #d9e0ee;border-radius:9px;background:#fff;width:100%}
  textarea{resize:vertical}
  .hint{color:#6b7590;font-size:12.5px;margin:4px 0}
  .btn{font:inherit;border:1px solid #d9e0ee;background:#fff;color:#1d2437;border-radius:9px;
    padding:8px 14px;cursor:pointer}
  .btn.primary{background:#2a5bd7;border-color:#2a5bd7;color:#fff}
  .btn.danger{background:#e5484d;border-color:#e5484d;color:#fff}
  .btn.ghost:hover{background:#f2f6ff}
  .btn svg.ic-btn{width:16px;height:16px;vertical-align:-3px;margin-right:5px;fill:none;
    stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .checkbox{flex-direction:row !important;align-items:center;gap:7px}
  .sub-save{position:sticky;bottom:0;background:linear-gradient(#fff0,#fff 40%);
    padding:14px 0 4px;display:flex;gap:10px}
  .badge{padding:2px 9px;border-radius:999px;font-size:12px;background:#eef2f9;color:#4a5673}
  .badge.ok{background:#e6f7ee;color:#12805c}
  .badge.warn{background:#fff4e5;color:#b45309}
  .badge.danger{background:#fdeaea;color:#b3261e}
  .drawer-mask{position:fixed;inset:0;background:rgba(12,20,40,.38);opacity:0;
    pointer-events:none;transition:opacity .22s ease;z-index:60}
  body.drawer-open .drawer-mask{opacity:1;pointer-events:auto}
  .app-drawer{position:fixed;top:0;right:0;height:100%;width:270px;max-width:86vw;z-index:61;
    background:#fff;box-shadow:-6px 0 24px rgba(16,28,60,.16);display:flex;flex-direction:column;
    transform:translateX(104%);transition:transform .26s cubic-bezier(.22,.8,.3,1)}
  body.drawer-open .app-drawer{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border-bottom:1px solid #e6ebf5;font-weight:600;font-size:14px}
  .drawer-close{background:#f1f4fb;border:0;border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
  .drawer-list{padding:10px;display:flex;flex-direction:column;gap:4px;overflow:auto;flex:1}
  .app-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
    color:#1d2437;text-decoration:none;font-size:14px}
  .app-item:hover{background:#f2f6ff}
  .app-item .ic{width:22px;height:22px;flex:none;fill:none;stroke:#2a5bd7;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .drawer-sep{height:1px;background:#eef2f9;margin:8px 12px}
  .drawer-foot{padding:12px 16px;border-top:1px solid #eef2f9;color:#8b96ad;font-size:12px}
  /* 左边缘悬停出菜单 */
  .edge-hot{position:fixed;left:0;top:0;width:8px;height:100%;z-index:59}
  body.edge-open .app-drawer{transform:translateX(0)}
  body.edge-open .drawer-mask{opacity:1;pointer-events:auto}

  .form-grid label{align-items:flex-start}
  .form-grid label:has(input[type=checkbox]){flex-direction:row;align-items:center;gap:8px}
  input[type=checkbox]{width:auto;flex:none;margin:0}
  .badge{display:inline-block;width:auto;align-self:flex-start}
  .form-row .badge{margin-top:2px}
  #tunnel-list .hint{display:flex !important;align-items:center;gap:8px;margin:6px 0}
  .pair-right,.pair-left{min-width:0}
</style>
</style>
</head>
<body>
{% include "_icons.html" %}

<div id="drawer-mask" class="drawer-mask"></div>
<aside id="app-drawer" class="app-drawer" aria-hidden="true">
  <div class="drawer-head"><span>应用</span><button class="drawer-close" id="drawer-close">关闭</button></div>
  <div class="drawer-list">
    <a class="app-item" href="/"><svg class="ic"><use href="#ic-call"/></svg><span>叫号主界面</span></a>
    <a class="app-item" href="/monitor"><svg class="ic"><use href="#ic-monitor"/></svg><span>屏幕监控</span></a>
    <a class="app-item" href="/files"><svg class="ic"><use href="#ic-files"/></svg><span>文件传输</span></a>
    <a class="app-item" href="/remote"><svg class="ic"><use href="#ic-remote"/></svg><span>手机远控</span></a>
    <a class="app-item" href="/admin"><svg class="ic"><use href="#ic-admin"/></svg><span>管理员后台</span></a>
    <div class="drawer-sep"></div>
    <a class="app-item" href="/settings/personal"><svg class="ic"><use href="#ic-personal"/></svg><span>个性化</span></a>
    <a class="app-item" href="/settings/network"><svg class="ic"><use href="#ic-network"/></svg><span>内网服务</span></a>
    <a class="app-item" href="/settings/control"><svg class="ic"><use href="#ic-control"/></svg><span>监控和远控</span></a>
    <a class="app-item" href="/settings/tunnel"><svg class="ic"><use href="#ic-tunnel"/></svg><span>内网穿透</span></a>
  </div>
  <div class="drawer-foot">版本 2.0.36</div>
</aside>

<div class="edge-hot" id="edge-hot" title="鼠标移到最左侧可打开应用列表"></div>
<header class="sub-top">
  <button class="sub-back" id="sub-back"><svg><use href="#ic-arrow-left"/></svg>返回主页</button>
  <span class="sub-title">内网服务</span>
</header>
<div class="wrap">
  <div class="card" id="settings-body">
<h4 class="set-group">内网服务</h4>
          <label class="checkbox"><input id="set-mdns-enabled" type="checkbox" /> 启用 mDNS 局域网访问</label>
        <label>主机名 <input id="set-mdns-hostname" placeholder="如 classroom" /></label>
        <label>网卡
          <select id="set-mdns-interface">
            <option value="auto">自动（全部网卡）</option>
          </select>
        </label>
        <label>端口 <input id="set-port" type="number" min="1" max="65535" /></label>
      </div>
      <p class="hint">其他设备浏览器访问：http://主机名.local:端口（修改端口后需重启软件生效）</p>
      <div class="form-grid">
        <label class="checkbox"><input id="set-secure-enabled" type="checkbox" /> 启用 HTTPS 安全端口</label>
        <label>安全端口 <input id="set-secure-port" type="number" min="1" max="65535" /></label>
      </div>
      <p class="hint">手机端“激活 / 监控 / 远程控制 / 文件传输”等敏感功能需通过 https://主机名.local:安全端口 访问（自签名证书，首次需点“继续访问”）。</p>
      <div class="form-grid">
  </div>
  <div class="sub-save">
    <button class="btn primary" id="btn-save-settings">保存设置</button>
    <span class="hint" id="save-msg"></span>
  </div>
</div>
<script src="/static/settings.js?v=20261125a"></script>
</body>
</html>
