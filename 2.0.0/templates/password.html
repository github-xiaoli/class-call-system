<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密码管理</title>
<link rel="stylesheet" href="/static/style.css?v=20261119f">
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-icon" src="/static/icon.png" alt="">密码管理</div>
  <div class="topbar-right">
    <a href="/" class="btn ghost">← 返回主页</a>
  </div>
</header>

<main class="page-wrap">
  <section class="panel">
    <h2 style="margin-bottom:10px">创建激活密码</h2>
    <div class="form-grid">
      <label>密码内容
        <div class="pw-row">
          <input id="pw-content" type="text" placeholder="例如：class2026" />
          <button id="btn-random" class="btn small" type="button">🎲 随机6位</button>
        </div>
      </label>
      <label>名称
        <input id="pw-name" type="text" maxlength="40" placeholder="例如：王老师手机" />
      </label>
      <label>备注
        <input id="pw-note" type="text" maxlength="100" placeholder="例如：周三公开课使用" />
      </label>
      <label>激活时限（分钟）
        <input id="pw-activate-minutes" type="number" min="1" max="1440" value="60" />
      </label>
      <label>激活后有效期（天）
        <input id="pw-valid-days" type="number" min="1" max="365" value="30" />
      </label>
    </div>
    <p class="hint">激活时限：超过该时间未激活，密码作废。激活后有效期：设备绑定从激活起持续该天数，到期后需重新创建密码再激活。</p>
    <div style="margin-top:12px">
      <button id="btn-create" class="btn primary">创建密码</button>
    </div>
  </section>

  <section class="panel">
    <h2 style="margin-bottom:10px">📱 扫码配对（推荐）</h2>
    <p class="hint">点按钮生成二维码，手机扫一下自动配对，不用手输密码；
      手机也可以直接打开 <b id="pair-url">加载中…</b> 手动输入配对码。</p>
    <div class="form-row">
      <label>名称（可改）</label>
      <input id="qr-name" type="text" maxlength="40" placeholder="例如：王老师手机" />
    </div>
    <div class="form-row">
      <label>备注（可改）</label>
      <input id="qr-note" type="text" maxlength="100" placeholder="例如：周三公开课使用" />
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button id="btn-qr-create" class="btn primary" type="button">生成配对二维码</button>
      <button id="btn-qr-copy" class="btn ghost" type="button" disabled>复制配对码</button>
    </div>
    <div id="qr-box" class="hidden" style="margin-top:16px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">
      <canvas id="qr-canvas" width="200" height="200"
              style="background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,.12)"></canvas>
      <div>
        <div style="font-size:15px">配对码：<b id="qr-code" style="font-size:20px;letter-spacing:2px">—</b></div>
        <div class="hint" style="margin-top:6px">30 分钟内有效，只能用一次</div>
        <div class="hint" id="qr-who" style="margin-top:4px"></div>
      </div>
    </div>
    <p class="hint" style="color:#b45309;margin-top:12px">⚠️ 重新生成会让上一张二维码立刻失效；一张码只能配一台设备。</p>
  </section>

  <section class="panel">
    <h2 style="margin-bottom:10px">已创建的密码</h2>
    <div class="pw-list" id="pw-list"></div>
    <p class="hint empty" id="pw-empty">暂无密码</p>
    <p class="hint" style="color:#b45309">⚠️ 设备激活后即永久绑定：请提醒使用者不要清除浏览器数据、卸载浏览器，也不要对手机恢复出厂、刷机或重装系统，否则密钥丢失需重新创建密码再激活。撤销密码会同时解除已绑定设备。</p>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/static/qrcode.js?v=20261119f"></script>
<script src="/static/password.js?v=20261119f"></script>
</body>
</html>
