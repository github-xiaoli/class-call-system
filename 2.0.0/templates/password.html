<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密码管理</title>
<link rel="stylesheet" href="/static/style.css?v=20261118b">
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-icon" src="/static/icon.png" alt="">密码管理</div>
  <div class="topbar-right">
    <a href="/" class="btn ghost">← 返回主页</a>
  </div>
</header>

<main class="page-wrap">
  <section class="panel">
    <h2 style="margin-bottom:10px">创建激活密码</h2>
    <div class="form-grid">
      <label>密码内容
        <div class="pw-row">
          <input id="pw-content" type="text" placeholder="例如：class2026" />
          <button id="btn-random" class="btn small" type="button">🎲 随机6位</button>
        </div>
      </label>
      <label>名称
        <input id="pw-name" type="text" maxlength="40" placeholder="例如：王老师手机" />
      </label>
      <label>备注
        <input id="pw-note" type="text" maxlength="100" placeholder="例如：周三公开课使用" />
      </label>
      <label>激活时限（分钟）
        <input id="pw-activate-minutes" type="number" min="1" max="1440" value="60" />
      </label>
      <label>激活后有效期（天）
        <input id="pw-valid-days" type="number" min="1" max="365" value="30" />
      </label>
    </div>
    <p class="hint">激活时限：超过该时间未激活，密码作废。激活后有效期：设备绑定从激活起持续该天数，到期后需重新创建密码再激活。</p>
    <div style="margin-top:12px">
      <button id="btn-create" class="btn primary">创建密码</button>
    </div>
  </section>

  <section class="panel">
    <h2 style="margin-bottom:10px">已创建的密码</h2>
    <div class="pw-list" id="pw-list"></div>
    <p class="hint empty" id="pw-empty">暂无密码</p>
    <p class="hint" style="color:#b45309">⚠️ 设备激活后即永久绑定：请提醒使用者不要清除浏览器数据、卸载浏览器，也不要对手机恢复出厂、刷机或重装系统，否则密钥丢失需重新创建密码再激活。撤销密码会同时解除已绑定设备。</p>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/static/password.js?v=20261113d"></script>
</body>
</html>
