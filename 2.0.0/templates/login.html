<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 班级叫号器</title>
<link rel="stylesheet" href="/static/style.css?v=20261121a">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><img src="/static/icon.png" alt="">班级叫号器</div>
    <p class="login-sub" id="login-sub">请使用管理员分配的账号登录</p>

    <!-- 首次运行：创建第一个管理员（只能在本机） -->
    <form id="form-bootstrap" class="hidden" autocomplete="off">
      <label class="login-field">
        <span>管理员用户名</span>
        <input id="boot-username" type="text" maxlength="20" value="admin"
               autocapitalize="off" spellcheck="false" placeholder="例如 admin" />
      </label>
      <label class="login-field">
        <span>设置密码</span>
        <input id="boot-pwd" type="password" maxlength="128"
               autocomplete="new-password" placeholder="至少 8 位，别用 12345678" />
      </label>
      <label class="login-field">
        <span>确认密码</span>
        <input id="boot-pwd2" type="password" maxlength="128"
               autocomplete="new-password" placeholder="再输一次" />
      </label>
      <button type="submit" class="login-btn" id="btn-bootstrap">创建管理员并登录</button>
      <p class="login-hint">
        第一次使用需要先建一个管理员账号。这个密码就是以后手机/公网访问要输的密码，
        请设置得长一点（≥8 位）。**只能在电脑本机上创建**。
      </p>
    </form>

    <!-- 登录 -->
    <form id="form-login" autocomplete="on">
      <label class="login-field">
        <span>用户名</span>
        <input id="username" name="username" type="text" maxlength="20"
               autocomplete="username" autocapitalize="off" spellcheck="false"
               placeholder="请输入用户名" />
      </label>
      <label class="login-field">
        <span>密码</span>
        <input id="password" name="password" type="password" maxlength="128"
               autocomplete="current-password" placeholder="请输入密码" />
      </label>
      <button type="submit" class="login-btn" id="btn-login">登录</button>
    </form>

    <!-- 忘记密码 / 重置（仅电脑本机可用，公网访问不提供） -->
    <form id="form-reset" class="hidden" autocomplete="off">
      <label class="login-field">
        <span>用户名</span>
        <input id="reset-username" type="text" maxlength="20"
               autocapitalize="off" spellcheck="false" placeholder="要重置的账号" />
      </label>
      <label class="login-field">
        <span>新密码</span>
        <input id="reset-pwd" type="password" maxlength="128"
               autocomplete="new-password" placeholder="至少 8 位，避免常见弱口令" />
      </label>
      <button type="submit" class="login-btn" id="btn-reset">重置密码</button>
      <p class="login-hint">出于安全，重置密码只能在<b>这台电脑上</b>操作；手机/公网访问没有这个入口。</p>
    </form>

    <div id="login-msg" class="login-msg"></div>

    <div class="login-foot">
      <span id="foot-hint">忘记密码？</span>
      <button type="button" class="login-link" id="btn-toggle">在电脑上重置</button>
    </div>
  </div>
</div>

<script nonce="{{ csp_nonce }}">
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var msgBox = $("login-msg");

  function showMsg(text, kind) {
    msgBox.textContent = text || "";
    msgBox.className = "login-msg" + (text ? " show " + (kind || "err") : "");
  }

  function postJSON(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "响应解析失败" }; })
        .then(function (d) { return { status: r.status, data: d }; });
    });
  }

  /* ---------- 登录 ---------- */
  $("form-login").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("username").value.trim();
    var p = $("password").value;
    if (!u || !p) { showMsg("请输入用户名和密码"); return; }

    var btn = $("btn-login");
    btn.disabled = true; btn.textContent = "登录中…"; showMsg("");

    postJSON("/api/auth/login", { username: u, password: p })
      .then(function (res) {
        if (!res.data.ok) { showMsg(res.data.error || "登录失败"); return; }
        if (res.data.needs_change) {
          location.href = "/login?change=1";
        } else {
          location.href = "/";
        }
      })
      .catch(function () { showMsg("网络异常，请重试"); })
      .finally(function () { btn.disabled = false; btn.textContent = "登录"; });
  });

  /* ---------- 重置 ---------- */
  $("form-reset").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("reset-username").value.trim();
    var p = $("reset-pwd").value;
    if (!u) { showMsg("请输入用户名"); return; }
    if (p.length < 8) { showMsg("新密码至少 8 位"); return; }

    var btn = $("btn-reset");
    btn.disabled = true; btn.textContent = "重置中…"; showMsg("");

    postJSON("/api/auth/reset", { username: u, new_password: p })
      .then(function (res) {
        if (!res.data.ok) { showMsg(res.data.error || "重置失败"); return; }
        showMsg(res.data.message || "密码已重置，请用新密码登录", "ok");
        $("username").value = u;
        setTimeout(function () { toggleMode(false); $("password").focus(); }, 900);
      })
      .catch(function () { showMsg("网络异常，请重试"); })
      .finally(function () { btn.disabled = false; btn.textContent = "重置密码"; });
  });

  /* ---------- 两态切换 ---------- */
  function toggleMode(toReset) {
    $("form-login").classList.toggle("hidden", toReset);
    $("form-reset").classList.toggle("hidden", !toReset);
    $("btn-toggle").textContent = toReset ? "返回登录" : "在电脑上重置";
    $("foot-hint").textContent = toReset ? "重置后需要立即修改密码" : "忘记密码？";
    $("login-sub").textContent = toReset
      ? "只能在这台电脑上重置密码"
      : "请使用管理员分配的账号登录";
    showMsg("");
  }

  var inReset = false;
  $("btn-toggle").addEventListener("click", function () {
    inReset = !inReset;
    toggleMode(inReset);
  });

  /* ---------- 首次运行：创建管理员 ---------- */
  $("form-bootstrap").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("boot-username").value.trim();
    var p = $("boot-pwd").value;
    var p2 = $("boot-pwd2").value;
    if (!u) { showMsg("请输入管理员用户名"); return; }
    if (p.length < 8) { showMsg("密码至少 8 位"); return; }
    if (p !== p2) { showMsg("两次输入的密码不一致"); return; }
    var btn = $("btn-bootstrap");
    btn.disabled = true; btn.textContent = "创建中…"; showMsg("");
    postJSON("/api/auth/bootstrap", { username: u, password: p })
      .then(function (res) {
        if (!res.data.ok) { showMsg(res.data.error || "创建失败"); return; }
        showMsg("创建成功，正在进入…", "ok");
        setTimeout(function () { location.href = "/"; }, 600);
      })
      .catch(function () { showMsg("网络异常，请重试"); })
      .finally(function () { btn.disabled = false; btn.textContent = "创建管理员并登录"; });
  });

  /* ---------- 首次登录强制改密 ---------- */
  var qs = new URLSearchParams(location.search);
  if (qs.get("change")) {
    $("login-sub").textContent = "首次登录需要修改初始密码";
    showMsg("请先在下方登录，登录后按提示修改密码", "warn");
  }

  // 已经登录过就直接进主页；还没建号就切到"创建管理员"
  fetch("/api/auth/session").then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.logged_in && !d.user.must_change_pwd) { location.href = "/"; return; }
    if (d && d.need_bootstrap && d.local) {
      $("form-login").classList.add("hidden");
      $("form-reset").classList.add("hidden");
      $("form-bootstrap").classList.remove("hidden");
      $("login-sub").textContent = "第一次使用：先创建管理员账号";
      document.querySelector(".login-foot").style.display = "none";
      $("boot-username").focus();
    } else {
      $("username").focus();
    }
  }).catch(function () { $("username").focus(); });

  if (!document.querySelector("#form-bootstrap:not(.hidden)")) { $("username").focus(); }
})();
</script>
</body>
</html>
