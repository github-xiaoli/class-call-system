<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>配对这台设备 · 班级叫号器</title>
<link rel="stylesheet" href="/static/style.css?v=20261119f">
<style>
  html, body { min-height: 100%; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         padding: 18px; overflow-y: auto; -webkit-overflow-scrolling: touch;
         background: linear-gradient(160deg, #e0f2fe 0%, #a7f3d0 60%, #bbf7d0 100%);
         font-family: "Microsoft YaHei", system-ui, sans-serif; color: #0f172a; }
  .card { background: #fff; border-radius: 22px; box-shadow: 0 22px 60px rgba(15,23,42,.2);
          padding: 28px 24px 24px; width: min(420px, 92vw); margin: auto; text-align: center; }
  .spin { width: 52px; height: 52px; margin: 4px auto 16px; border: 5px solid #e2e8f0;
          border-top-color: #2563eb; border-radius: 50%; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .ok { font-size: 54px; margin-bottom: 6px; }
  .err { font-size: 54px; margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #475569; font-size: 14.5px; line-height: 1.8; margin: 6px 0; }
  input#code { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 14px 16px;
        border: 1.5px solid #cbd5e1; border-radius: 14px; font-size: 22px; text-align: center;
        letter-spacing: 3px; text-transform: uppercase; font-family: ui-monospace, Consolas, monospace; }
  input#code:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .btn { display: inline-block; margin-top: 16px; background: #2563eb; color: #fff; border: none;
         text-decoration: none; padding: 12px 24px; border-radius: 12px; font-size: 16px; width: 100%;
         box-sizing: border-box; cursor: pointer; }
  .btn:disabled { opacity: .55; }
  .tip { margin-top: 14px; font-size: 12.5px; color: #94a3b8; line-height: 1.7; }
  .hidden { display: none; }
  @media (max-height: 520px) {
    .card { padding: 18px 16px 16px; border-radius: 16px; }
    .spin { width: 38px; height: 38px; border-width: 4px; margin-bottom: 10px; }
    h1 { font-size: 17px; } p { font-size: 13px; line-height: 1.6; }
    input#code { padding: 11px 14px; font-size: 19px; }
    .btn { margin-top: 12px; padding: 10px 18px; font-size: 15px; }
  }
</style>
</head>
<body>
{% include "_icons.html" %}
<div class="card">
  <div id="box-loading">
    <div class="spin"></div>
    <h1>正在配对…</h1>
    <p>请稍候</p>
  </div>

  <div id="box-form" class="hidden">
    <h1>配对这台设备</h1>
    <p>输入电脑上显示的<b>配对码</b>（8 位字母数字）</p>
    <input id="code" inputmode="latin" autocomplete="off" autocapitalize="characters"
           spellcheck="false" maxlength="12" placeholder="ABC12XYZ">
    <button id="btn-go" class="btn">配对并进入</button>
    <div class="tip">配对码在电脑上「<svg class="ic-inline"><use href="#ic-phone"/></svg> 扫码配对」或设置向导第 6 步里显示；<br>
      一张配对码只能给一台手机用，30 分钟内有效。</div>
  </div>

  <div id="box-ok" class="hidden">
    <div class="ok"><svg class="ic-inline ok"><use href="#ic-check"/></svg></div>
    <h1>配对成功</h1>
    <p>这台设备已经和电脑绑定，正在进入…</p>
    <a class="btn" href="/">立即进入</a>
  </div>

  <div id="box-err" class="hidden">
    <div class="err"><svg class="ic-inline warn"><use href="#ic-warn"/></svg></div>
    <h1>配对失败</h1>
    <p id="err-text">—</p>
    <button id="btn-retry" class="btn">重新输入</button>
    <div class="tip">配对码错误、已使用或已过期时，请在电脑上重新生成一个。</div>
  </div>
</div>
<script src="/static/auth.js?v=20261119f"></script>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const token = qs.get("t") || "";
  const show = (id) => {
    ["box-loading", "box-form", "box-ok", "box-err"].forEach((k) => {
      document.getElementById(k).classList.toggle("hidden", k !== id);
    });
  };
  const fail = (msg) => { document.getElementById("err-text").textContent = msg; show("box-err"); };

  async function byToken(t) {
    try {
      const r = await Auth.activateByToken(t);
      show("box-ok");
      setTimeout(() => { location.href = "/"; }, 1200);
      return r;
    } catch (e) {
      fail(e.message || "配对码无效或已过期");
    }
  }

  async function byCode() {
    const v = (document.getElementById("code").value || "").trim().toUpperCase();
    if (!v) { fail("请输入配对码"); return; }
    const btn = document.getElementById("btn-go");
    btn.disabled = true; btn.textContent = "配对中…";
    try {
      await Auth.activate(v);
      show("box-ok");
      setTimeout(() => { location.href = "/"; }, 1200);
    } catch (e) {
      btn.disabled = false; btn.textContent = "配对并进入";
      fail(e.message || "配对失败，请检查配对码");
    }
  }

  document.getElementById("btn-go").addEventListener("click", byCode);
  document.getElementById("code").addEventListener("keydown", (e) => {
    if (e.key === "Enter") byCode();
  });
  document.getElementById("btn-retry").addEventListener("click", () => show("box-form"));

  if (token) { show("box-loading"); byToken(token); }
  else { show("box-form"); }
})();
</script>
</body>
</html>
