<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班级叫号器 · 选择电脑</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css?v=20261127a">
<style>
/* 入口页：只做「选机器 + 建立直连」，连上后立刻跳到原站首页 */
.gate { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
.gate-title { text-align:center; margin: 18px 0 22px; }
.gate-title h1 { font-size: 20px; margin: 0 0 6px; }
.gate-title p { color: #6b7a99; font-size: 13.5px; margin: 0; }
.gate-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.gate-list li { display: flex; align-items: center; gap: 12px; padding: 15px 16px;
  background: #fff; border: 1px solid #e2e8f4; border-radius: 14px; cursor: pointer;
  transition: .15s; box-shadow: 0 4px 14px rgba(30,60,120,.05); }
.gate-list li:hover { border-color: #2a5bd7; transform: translateY(-1px); }
.gate-list .g-name { font-weight: 600; }
.gate-list .g-sn { color: #6b7a99; font-size: 12.5px; font-family: Consolas, monospace; }
.gate-list .g-badge { margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
.g-badge.on { background: #e8f7ef; color: #1a9d63; }
.g-badge.off { background: #f1f3f8; color: #6b7a99; }
.gate-hint { text-align:center; color: #6b7a99; font-size: 13px; margin-top: 18px; line-height: 1.7; }
.gate-err { color: #c0392b; font-size: 13.5px; min-height: 20px; text-align:center; margin-top: 10px; }
.gate-steps { margin: 26px auto 0; max-width: 420px; color: #6b7a99; font-size: 13.5px; }
.gate-steps li.now { color: #2a5bd7; font-weight: 600; }
.gate-steps li.done { color: #1a9d63; }
</style>
</head>
<body>

<div class="gate">
  <div class="gate-title">
    <h1>班级叫号器</h1>
    <p>选择要连的教室电脑</p>
  </div>

  <ul class="gate-list" id="gate-list"></ul>
  <p class="gate-hint" id="gate-hint">正在读取机器列表…</p>
  <p class="gate-err" id="gate-err"></p>

  <ol class="gate-steps" id="gate-steps"></ol>
</div>

<script src="/config.js?v=2611281920"></script>
<script src="/p2p-shim.js?v=2611281920"></script>
<script>
(function () {
  const CFG = window.PORTAL_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  let machines = [];

  function step(text, mode) {
    const li = document.createElement("li");
    li.textContent = text;
    li.className = mode || "now";
    const box = $("gate-steps");
    for (const el of box.children) el.className = "done";
    box.appendChild(li);
  }

  async function loadMachines() {
    try {
      const f = (window.p2p && window.p2p.rawFetch) ? window.p2p.rawFetch : fetch;
      const r = await f.call(window, CFG.apiBase + "/api/machines", { cache: "no-store" });
      const d = await r.json();
      machines = d.machines || [];
      render();
    } catch (e) {
      $("gate-hint").textContent = "读取机器列表失败：" + e.message;
    }
  }

  // 已经连着电脑就直接进原站界面（刷新页面也不用重选）
  function jumpIfConnected() {
    window.p2p.hello();
    setTimeout(() => {
      const st = window.p2p.state();
      if (st.state === "connected") location.href = "/call";
    }, 600);
  }

  function render() {
    const ul = $("gate-list");
    ul.innerHTML = "";
    if (!machines.length) {
      $("gate-hint").textContent = "还没有电脑注册。请在教室电脑上打开叫号器 → 设置 → 内网穿透 → 云端门户，填总密码完成注册。";
      return;
    }
    $("gate-hint").textContent = "共 " + machines.length + " 台，点一下即可直连。";
    for (const m of machines) {
      const li = document.createElement("li");
      li.innerHTML = '<div><div class="g-name"></div><div class="g-sn"></div></div>' +
        '<span class="g-badge ' + (m.online ? "on" : "off") + '">' +
        (m.online ? "在线" : "离线") + "</span>";
      li.querySelector(".g-name").textContent = m.name || m.sn;
      li.querySelector(".g-sn").textContent = m.sn + (m.version ? " · v" + m.version : "");
      li.addEventListener("click", () => start(m));
      ul.appendChild(li);
    }
  }

  function start(m) {
    $("gate-err").textContent = "";
    $("gate-list").style.opacity = ".5";
    $("gate-list").style.pointerEvents = "none";
    $("gate-steps").innerHTML = "";
    step("正在建立 P2P 直连…");
    window.p2p.connect(m.sn, m.name);

    let waited = 0;
    const timer = setInterval(() => {
      waited += 500;
      const st = window.p2p.state();
      if (st.state === "connected") {
        clearInterval(timer);
        step("直连已建立，正在进入…", "done");
        // 进入原站首页（界面与电脑上的原站完全一致）
        try { sessionStorage.setItem("cc-p2p-sn", m.sn); } catch (e) {}
        setTimeout(() => { location.href = "/call?sn=" + encodeURIComponent(m.sn) +
                           "&name=" + encodeURIComponent(m.name || m.sn); }, 200);
        return;
      }
      if (st.state === "failed") {
        step("这次没连上，正在重试…");
      }
      if (waited > 120000) {
        clearInterval(timer);
        $("gate-err").textContent = "连接超时，请确认教室电脑已开机并已联网，或稍后再试。";
        $("gate-list").style.opacity = "";
        $("gate-list").style.pointerEvents = "";
      }
    }, 500);

    window.addEventListener("p2pstate", function onState(ev) {
      if (ev.detail && ev.detail.state === "failed") {
        step("这次没连上，正在自动重试…");
      }
    });
  }

  jumpIfConnected();
  loadMachines();
  setInterval(() => {
    if (!document.querySelector("#gate-list li")) loadMachines();
  }, 20000);
})();
</script>
</body>
</html>
