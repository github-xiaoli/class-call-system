<style>
  html, body { min-height: 100%; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         padding: 18px; overflow-y: auto; -webkit-overflow-scrolling: touch;
         background: linear-gradient(160deg, #e0f2fe 0%, #a7f3d0 60%, #bbf7d0 100%);
         font-family: "Microsoft YaHei", system-ui, sans-serif; color: #0f172a; }
  /* margin:auto：内容比屏幕高时自动塌成 0，配合 body 滚动，按钮不会被切掉 */
  .card { background: #fff; border-radius: 22px; box-shadow: 0 22px 60px rgba(15,23,42,.2);
          padding: 30px 26px 26px; width: min(420px, 92vw); margin: auto; text-align: center; }
  .spin { width: 52px; height: 52px; margin: 4px auto 16px; border: 5px solid #e2e8f0;
          border-top-color: #2563eb; border-radius: 50%; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .ok { font-size: 54px; margin-bottom: 6px; }
  .err { font-size: 54px; margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #475569; font-size: 14.5px; line-height: 1.8; margin: 6px 0; }
  .btn { display: inline-block; margin-top: 16px; background: #2563eb; color: #fff;
         text-decoration: none; padding: 11px 24px; border-radius: 12px; font-size: 15px; }
  .tip { margin-top: 14px; font-size: 12.5px; color: #94a3b8; }
  .hidden { display: none; }
  /* 矮屏（横屏手机 / 系统字体放大）：压缩留白，保证按钮始终可见 */
  @media (max-height: 480px) {
    .card { padding: 20px 18px 18px; border-radius: 16px; }
    .spin { width: 38px; height: 38px; border-width: 4px; margin-bottom: 10px; }
    .ok, .err { font-size: 38px; }
    h1 { font-size: 17px; }
    p { font-size: 13px; line-height: 1.6; }
    .btn { margin-top: 12px; padding: 9px 18px; font-size: 14px; }
  }
</style>

<script src="/static/auth.js?v=20261127a"></script>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const token = qs.get("t") || "";
  const errText = document.getElementById("err-text");
  function fail(msg) {
    document.getElementById("box-loading").classList.add("hidden");
    document.getElementById("box-err").classList.remove("hidden");
    errText.textContent = msg;
  }
  function ok() {
    document.getElementById("box-loading").classList.add("hidden");
    document.getElementById("box-ok").classList.remove("hidden");
    setTimeout(() => { location.href = "/"; }, 900);
  }
  (async function () {
    if (!token) { fail("这个链接里没有激活票据，请重新扫描电脑上的二维码。"); return; }
    if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
      fail("当前不是安全连接（https），浏览器不提供加密能力，无法激活。请用二维码里的 https 地址打开。");
      return;
    }
    try {
      await Auth.activateByToken(token);
      ok();
    } catch (e) {
      fail(e && e.message ? e.message : "激活失败，请重试");
    }
  })();
})();
</script>
